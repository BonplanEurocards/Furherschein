<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Führerschein Express - Recensement TikTok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .btn-wa { background-color: #25D366; transition: all 0.3s ease; }
        .btn-wa:hover { background-color: #128C7E; transform: translateY(-2px); }
        input, select { font-size: 16px !important; } /* Évite le zoom auto sur iPhone */
    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden">
        <div class="bg-blue-700 p-8 text-white text-center">
            <div class="inline-block p-3 bg-white/20 rounded-full mb-4">
                <i class="fas fa-id-card text-3xl"></i>
            </div>
            <h1 class="text-2xl font-black uppercase tracking-tighter">Führerschein Express</h1>
            <p class="text-sm font-medium opacity-80">Recensement spécial Communauté TikTok</p>
        </div>

        <div class="p-8">
            <p class="text-gray-600 text-sm mb-6 text-center italic">
                Remplissez vos infos et cliquez sur le bouton pour m'envoyer votre dossier directement.
            </p>

            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Nom / Pseudo TikTok</label>
                    <input type="text" id="userName" 
                        class="w-full px-4 py-4 bg-gray-50 border-2 border-gray-100 rounded-xl focus:border-blue-500 focus:bg-white outline-none transition-all" 
                        placeholder="Ex: @JeanPermis99">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Votre situation</label>
                    <select id="userNeed" 
                        class="w-full px-4 py-4 bg-gray-50 border-2 border-gray-100 rounded-xl focus:border-blue-500 focus:bg-white outline-none appearance-none">
                        <option value="Nouveau Permis">🚗 Je veux passer le permis</option>
                        <option value="Échec Examen">❌ J'ai échoué (Besoin d'aide)</option>
                        <option value="Dossier MPU">⚖️ J'ai besoin d'un MPU</option>
                        <option value="Retrait de Permis">🚫 Mon permis est suspendu</option>
                    </select>
                </div>

                <button onclick="envoyerMessage()" 
                    class="btn-wa w-full text-white font-extrabold py-5 rounded-xl shadow-xl flex items-center justify-center gap-3 text-lg uppercase tracking-wider">
                    <i class="fab fa-whatsapp text-2xl"></i>
                    Envoyer ma demande
                </button>
            </div>

            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Service Express Allemagne 🇩🇪</span>
            </div>
        </div>
    </div>

    <script>
        function envoyerMessage() {
            const nom = document.getElementById('userName').value;
            const besoin = document.getElementById('userNeed').value;
            
            // REMPLACE PAR TON NUMÉRO (Format: 49XXXXXXXX)
            const monNumero = "491761234567"; 

            if (!nom) {
                alert("Oups ! Entre ton nom ou ton pseudo TikTok d'abord.");
                return;
            }

            // Construction du message WhatsApp
            const texte = `Salut Führerschein Express !\n\n*NOUVEAU CLIENT TIKTOK*\n--------------------------\n👤 *Nom:* ${nom}\n📋 *Besoin:* ${besoin}\n--------------------------\nPeux-tu me donner les détails ?`;
            
            const lien = `https://wa.me/${monNumero}?text=${encodeURIComponent(texte)}`;
            
            window.location.href = lien;
        }
    </script>

</body>
</html>
